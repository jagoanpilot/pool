<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PhantomRider Pool Dashboard</title>
  <style>
    :root{--bg:#0b1020;--card:#141b33;--text:#e8ecff;--muted:#9aa7d6;--accent:#5eead4;--warn:#fbbf24;--bad:#fb7185;--line:#22305a}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0b1020,#0a0f1d);color:var(--text)}
    header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    h1{margin:0;font-size:20px} .sub{color:var(--muted);font-size:13px}
    nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,16,32,.9);backdrop-filter:blur(6px)}
    nav button{background:#101831;color:var(--text);border:1px solid var(--line);padding:8px 12px;border-radius:8px;cursor:pointer}
    nav button.active{border-color:var(--accent);color:var(--accent)}
    main{padding:18px 20px;max-width:1200px;margin:0 auto}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
    .label{color:var(--muted);font-size:12px;margin-bottom:6px} .value{font-size:22px;font-weight:700}
    .ok{color:var(--accent)} .warn{color:var(--warn)} .bad{color:var(--bad)}
    table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{color:var(--muted);font-weight:600} .panel{display:none} .panel.active{display:block}
    pre{white-space:pre-wrap;background:#0e1428;border:1px solid var(--line);padding:12px;border-radius:10px;max-height:420px;overflow:auto}
    .muted{color:var(--muted)} .row{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:900px){.row{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <header>
    <div>
      <h1>PhantomRider Mining Pool</h1>
      <div class="sub">PHR-256-YP • Stratum • Dashboard</div>
    </div>
    <div class="sub" id="uptime">-</div>
  </header>
  <nav id="nav"></nav>
  <main>
    <section id="overview" class="panel active"></section>
    <section id="miners" class="panel"></section>
    <section id="workers" class="panel"></section>
    <section id="blocks" class="panel"></section>
    <section id="payments" class="panel"></section>
    <section id="statistics" class="panel"></section>
    <section id="configuration" class="panel"></section>
    <section id="logs" class="panel"></section>
  </main>
<script>
const pages = [
  ['overview','Overview'],['miners','Miners'],['workers','Workers'],['blocks','Blocks'],
  ['payments','Payments'],['statistics','Statistics'],['configuration','Configuration'],['logs','System Logs']
];
const nav = document.getElementById('nav');
pages.forEach(([id,label],i)=>{
  const b=document.createElement('button'); b.textContent=label; if(i===0)b.classList.add('active');
  b.onclick=()=>show(id,b); nav.appendChild(b);
});
function show(id,btn){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
async function j(u){const r=await fetch(u,{cache:'no-store'});return r.json()}
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function card(label,value,cls=''){return `<div class="card"><div class="label">${esc(label)}</div><div class="value ${cls}">${esc(value)}</div></div>`}
function table(rows,cols){if(!rows||!rows.length)return '<div class="card muted">Tidak ada data.</div>';let h='<div class="card" style="overflow:auto"><table><thead><tr>'+cols.map(c=>`<th>${esc(c[0])}</th>`).join('')+'</tr></thead><tbody>';for(const r of rows){h+='<tr>'+cols.map(c=>`<td>${esc(typeof c[1]==='function'?c[1](r):r[c[1]])}</td>`).join('')+'</tr>'}h+='</tbody></table></div>';return h}
async function refresh(){
  try{
    const st=await j('/api/status'); const ov=await j('/api/overview');
    document.getElementById('uptime').textContent = `Uptime: ${st.uptimeSec||0}s | RPC: ${st.rpc?.ok?'OK':'ERR'} | Stratum: ${st.stratum?.ok?'OK':'ERR'} | Algo: ${st.algorithmReady?'OK':'WAIT'}`;
    const net=st.network||{};
    document.getElementById('overview').innerHTML = `<div class="grid">
      ${card('Pool Hashrate', (st.pool?.hashrate||0)+' H/s')}
      ${card('Connected Miners', st.pool?.miners||ov.miners||0)}
      ${card('Active Workers', st.pool?.workers||ov.workers||0)}
      ${card('Block Height', net.height??'-')}
      ${card('Accepted Shares', st.pool?.accepted||ov.accepted||0,'ok')}
      ${card('Rejected Shares', st.pool?.rejected||ov.rejected||0,'warn')}
      ${card('Stale Shares', st.pool?.stale||ov.stale||0,'warn')}
      ${card('Blocks Found', st.pool?.blocksFound||ov.blocksFound||0,'ok')}
      ${card('Network Target', (net.target||'-').slice(0,16)+(net.target?'…':''))}
      ${card('Last Block', st.lastBlock?('#'+st.lastBlock.height):'-')}
    </div>
    <div class="card" style="margin-top:12px"><div class="label">Stratum</div><div>stratum+tcp://${location.hostname}:${st.stratum?.port||'3333'}</div>
    <div class="muted" style="margin-top:6px">Worker: <code>wallet_address.worker_name</code> | Password: <code>x</code></div>
    <div class="muted" style="margin-top:6px">Algoritma: <b>PHR-256-YP</b> (PhantomRider). Pastikan miner mendukung algoritma ini.</div></div>`;

    const miners=await j('/api/miners');
    document.getElementById('miners').innerHTML = table(miners.miners||[], [['Address','address'],['Reward','reward_type'],['Valid','valid_shares'],['Invalid','invalid_shares'],['Stale','stale_shares'],['Pending',r=>(r.pending_balance||0)],['Last Seen',r=>r.last_seen?new Date(r.last_seen).toLocaleString():'-']]);
    const workers=await j('/api/workers');
    document.getElementById('workers').innerHTML = table(workers.workers||[], [['Address','address'],['Worker','worker'],['Valid','valid_shares'],['Invalid','invalid_shares'],['Stale','stale_shares'],['Difficulty','difficulty'],['Last Seen',r=>r.last_seen?new Date(r.last_seen).toLocaleString():'-']]);
    const blocks=await j('/api/blocks');
    document.getElementById('blocks').innerHTML = table(blocks.blocks||[], [['Time',r=>r.ts?new Date(r.ts).toLocaleString():'-'],['Height','height'],['Hash','hash'],['PoW Hash','pow_hash'],['Miner','address'],['Worker','worker'],['Status','status']]);
    const payments=await j('/api/payments');
    document.getElementById('payments').innerHTML = table(payments.payments||[], [['Time',r=>r.ts?new Date(r.ts).toLocaleString():'-'],['Address','address'],['Amount','amount'],['TxID','txid'],['Status','status']]);
    document.getElementById('statistics').innerHTML = `<div class="row"><div class="card"><div class="label">24h Shares</div><div>Accepted: ${ov.accepted||0}<br>Rejected: ${ov.rejected||0}<br>Stale: ${ov.stale||0}</div></div><div class="card"><div class="label">Network</div><pre>${esc(JSON.stringify(net,null,2))}</pre></div></div><div class="card" style="margin-top:12px"><div class="label">Status Raw</div><pre>${esc(JSON.stringify(st,null,2))}</pre></div>`;
    const cfg=await j('/api/config');
    document.getElementById('configuration').innerHTML = `<div class="card"><div class="label">Konfigurasi (secret disembunyikan)</div><pre>${esc(JSON.stringify(cfg.config||cfg,null,2))}</pre></div>`;
    const logs=await j('/api/logs');
    document.getElementById('logs').innerHTML = `<div class="card"><div class="label">Tail Log</div><pre>${esc(logs.tail||'(kosong)')}</pre></div>`;
  }catch(e){console.error(e)}
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
